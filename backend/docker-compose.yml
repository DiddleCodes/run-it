version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runit
      POSTGRES_PASSWORD: runit
      POSTGRES_DB: runit_payments
    ports:
      - "5432:5432"
    volumes:
      - runit_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  runit_postgres_data:
