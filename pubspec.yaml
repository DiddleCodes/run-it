name: run_it
description: "Campus deliveries, powered by peers already heading your way."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Motion — declarative micro-animations used throughout
  flutter_animate: ^4.5.2

  # HTTP — the payments backend (Task 8b/8c) is the app's first real network
  # boundary; everything else is still a client-mocked repository.
  http: ^1.2.2

  # Vector assets (illustrations, icons)
  flutter_svg: ^2.0.17

  # Typography — Plus Jakarta Sans (display/CTA) + Inter (body/UI)
  google_fonts: ^6.2.1

  # Backend
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1

  # Utilities
  intl: ^0.20.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.0.0
  camera: ^0.12.0+2
  crypto: ^3.0.6
  geolocator: ^13.0.2
  mobile_scanner: ^7.4.0
  flutter_paystack_plus: ^2.6.0
  cached_network_image: ^4.0.0

  # Task 21b: the runner-dispatch live channel — the backend gateway is a
  # NestJS @WebSocketGateway, which defaults to the Socket.IO protocol (see
  # runner-dispatch.gateway.ts's own `socket.io` import), not raw
  # WebSocket — this client speaks the same protocol.
  socket_io_client: ^3.0.2

  # Task 28: moved from dev_dependencies — SplashScreen now calls
  # FlutterNativeSplash.remove() at runtime (see its own doc comment), so
  # this has to ship in the real app, not just back the `:create` codegen
  # step.
  flutter_native_splash: ^2.4.3

  # Task 31: crash/error reporting. firebase_core/auth/storage above are
  # declared but never actually initialized anywhere in this app (no
  # Firebase.initializeApp() call, no google-services.json/
  # GoogleService-Info.plist) — see crash_reporting.dart's own doc comment
  # for why that ruled out Crashlytics as the "already paid for" option.
  sentry_flutter: ^9.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Plus Jakarta Sans + Inter are loaded at runtime via google_fonts, so no
  # bundled font files are declared here. (GeneralSans/Satoshi OTFs remain
  # under assets/fonts/ but are no longer referenced.)

# Task 22: real app icon, generated from the run-it. wordmark's own dome
# glyph (assets/images/02_run-it_logo.png) composited onto the app's
# actual cream background (AppColors.backgroundCream) — see
# assets/icons/app_icon.png/app_icon_foreground.png. Regenerate with
# `dart run flutter_launcher_icons` after changing either source image.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FBF4E9"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

# Native launch screen (the brief flash before the in-Flutter SplashScreen
# widget takes over) — same cream background as SplashScreen's own
# backgroundCream base, so there's no color discontinuity in the handoff.
#
# Task 41: deliberately NOT app_icon_foreground.png (used above for the
# Android adaptive icon) — that file is intentionally mostly-transparent
# padding around a small centered glyph, which is correct for an adaptive
# icon (the OS masks/crops it) but rendered small and, since its two-tone
# maroon+pale-pink glyph loses most of its contrast against this same
# cream background, faded when drawn directly as a flat splash image with
# no masking. assets/icons/splash_icon.png is a dedicated asset: the same
# glyph, flattened to one solid AppColors.primaryMaroon (matching the
# ColorFiltered/BlendMode.srcIn treatment this mark already gets
# everywhere else it needs to read crisply — see welcome_back_screen.dart)
# and cropped tight enough to actually read at a glance. Regenerate with
# `dart run flutter_native_splash:create` after changing this asset.
#
# Task 28: iOS's LaunchImage.imageset PNGs are hand-replaced with crisp
# @1x/2x/3x exports downsampled directly from this source at their real
# 92pt display size — not regenerated through this 1024px `image` (which
# `:create` would upscale and export oversized/blurry). Re-running
# `dart run flutter_native_splash:create` overwrites those PNGs back to
# that oversized/blurry default AND resets LaunchScreen.storyboard's icon
# size/position back to dead-center — see that storyboard's own doc
# comment for the exact values to reapply after.
flutter_native_splash:
  color: "#FBF4E9"
  image: assets/icons/splash_icon.png
  android_12:
    color: "#FBF4E9"
    image: assets/icons/splash_icon.png
