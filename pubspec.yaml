name: run_it
description: "Campus deliveries, powered by peers already heading your way."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Motion — declarative micro-animations used throughout
  flutter_animate: ^4.5.2

  # Vector assets (illustrations, icons)
  flutter_svg: ^2.0.17

  # Typography — Plus Jakarta Sans (display/CTA) + Inter (body/UI)
  google_fonts: ^6.2.1

  # Backend
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1

  # Utilities
  intl: ^0.20.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.0.0
  camera: ^0.12.0+2
  crypto: ^3.0.6
  geolocator: ^13.0.2
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Plus Jakarta Sans + Inter are loaded at runtime via google_fonts, so no
  # bundled font files are declared here. (GeneralSans/Satoshi OTFs remain
  # under assets/fonts/ but are no longer referenced.)
