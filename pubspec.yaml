name: run_it
description: "Campus deliveries, powered by peers already heading your way."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Motion — declarative micro-animations used throughout
  flutter_animate: ^4.5.2

  # HTTP — the payments backend (Task 8b/8c) is the app's first real network
  # boundary; everything else is still a client-mocked repository.
  http: ^1.2.2

  # Vector assets (illustrations, icons)
  flutter_svg: ^2.0.17

  # Typography — Plus Jakarta Sans (display/CTA) + Inter (body/UI)
  google_fonts: ^6.2.1

  # Backend
  # Task 75: Firebase is now genuinely initialized at startup (see main.dart
  # and lib/firebase_options.dart); firebase_messaging is the push client
  # the next task wires device-token registration onto.
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.10
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1

  # Utilities
  intl: ^0.20.2
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.0.0
  camera: ^0.12.0+2
  crypto: ^3.0.6
  geolocator: ^13.0.2
  mobile_scanner: ^7.4.0
  flutter_paystack_plus: ^2.6.0
  cached_network_image: ^4.0.0

  # Task 21b: the runner-dispatch live channel — the backend gateway is a
  # NestJS @WebSocketGateway, which defaults to the Socket.IO protocol (see
  # runner-dispatch.gateway.ts's own `socket.io` import), not raw
  # WebSocket — this client speaks the same protocol.
  socket_io_client: ^3.0.2

  # Task 28: moved from dev_dependencies — SplashScreen now calls
  # FlutterNativeSplash.remove() at runtime (see its own doc comment), so
  # this has to ship in the real app, not just back the `:create` codegen
  # step.
  flutter_native_splash: ^2.4.3

  # Task 31: crash/error reporting — Sentry rather than Crashlytics (see
  # crash_reporting.dart's own doc comment for why).
  sentry_flutter: ^9.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/

  # Fraunces (headlines) + Manrope (body/UI) + JetBrains Mono (numeric/data
  # display) are loaded at runtime via google_fonts, so no bundled font
  # files are declared here. (GeneralSans/Satoshi OTFs remain under
  # assets/fonts/ but are no longer referenced.)

# Task 76: RUN-It rebrand. Every asset below is derived from the brand
# sources in design/branding/source/ by tool/generate_brand_assets.py (see
# its docstring) — change a source there, re-run that script, then both
# commands below.
#
# Launcher icon: the maroon "arrow" tile. app_icon.png is full-bleed
# (iOS applies its own corner mask, so no white may show); the Android
# adaptive icon draws the arrow (app_icon_foreground.png, inside the safe
# zone) over the same maroon. Regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#4F0B20"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  # The foreground is already laid out on the full 108dp adaptive canvas,
  # arrow inside the 66dp safe zone — the plugin's default 16% inset would
  # shrink it a second time (the "small, padded" failure Task 41 chased).
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FBF4E9"
    theme_color: "#4F0B20"

# Native launch screen (the brief flash before the in-Flutter SplashScreen
# takes over) — cream, like SplashScreen, so the handoff has no colour jump.
#
# iOS + Android < 12 show the stacked RUN iT lockup (splash_icon.png, at
# source resolution — treated as 4x). Android 12+ forces the splash icon
# into a circle, which would crop a wide lockup, so it gets the rounded
# arrow mark sized to fit inside that circle (splash_icon_android12.png).
#
# After `dart run flutter_native_splash:create`, re-apply two hand edits it
# overwrites: (1) re-run tool/generate_brand_assets.py, which re-exports the
# crisp iOS LaunchImage @1x/2x/3x (:create would upscale/blur them), and
# (2) LaunchScreen.storyboard's size/position constraints — see that file.
flutter_native_splash:
  color: "#FBF4E9"
  image: assets/icons/splash_icon.png
  android_12:
    color: "#FBF4E9"
    image: assets/icons/splash_icon_android12.png
